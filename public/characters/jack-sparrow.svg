<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 750' width='600' height='750'>
  <defs>
    <radialGradient id='bgJack' cx='50%' cy='40%' r='65%'>
      <stop offset='0%' stop-color='#2a1a0c'/>
      <stop offset='60%' stop-color='#120a04'/>
      <stop offset='100%' stop-color='#050201'/>
    </radialGradient>
    <linearGradient id='skinJack' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#d49b6a'/>
      <stop offset='100%' stop-color='#a66e44'/>
    </linearGradient>
    <linearGradient id='bandanaJack' x1='0%' y1='0%' x2='100%' y2='50%'>
      <stop offset='0%' stop-color='#b91c1c'/>
      <stop offset='100%' stop-color='#7f1d1d'/>
    </linearGradient>
    <linearGradient id='coatJack' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#292524'/>
      <stop offset='100%' stop-color='#0c0a09'/>
    </linearGradient>
  </defs>
  <rect width='600' height='750' fill='url(#bgJack)'/>
  
  <!-- Coat & Chest -->
  <path d='M100 750 L160 520 L240 550 L300 680 L360 550 L440 520 L500 750 Z' fill='url(#coatJack)'/>
  <polygon points='250,530 350,530 300,660' fill='#f5f5f4' opacity='0.9'/>
  <path d='M285 550 L315 550 L305 640 L295 640 Z' fill='#44403c'/>

  <!-- Dreadlocks Left & Right -->
  <path d='M170 330 Q130 450 160 620 Q190 480 210 370 Z' fill='#1c1917'/>
  <path d='M430 330 Q470 450 440 620 Q410 480 390 370 Z' fill='#1c1917'/>
  <!-- Beads in hair -->
  <circle cx='165' cy='460' r='8' fill='#eab308'/>
  <circle cx='162' cy='480' r='6' fill='#06b6d4'/>
  <circle cx='435' cy='470' r='7' fill='#f97316'/>
  <circle cx='438' cy='490' r='7' fill='#eab308'/>

  <!-- Neck & Face -->
  <path d='M260 440 L340 440 L330 540 L270 540 Z' fill='url(#skinJack)'/>
  <ellipse cx='300' cy='360' rx='95' ry='115' fill='url(#skinJack)'/>

  <!-- Goatee & braided beard -->
  <path d='M280 440 Q300 480 320 440 Q310 510 300 530 Q290 510 280 440 Z' fill='#1c1917'/>
  <circle cx='297' cy='495' r='5' fill='#94a3b8'/>
  <circle cx='303' cy='515' r='5' fill='#94a3b8'/>
  <path d='M260 410 Q300 425 340 410' stroke='#1c1917' stroke-width='6' fill='none' stroke-linecap='round'/>

  <!-- Eyes & Kohl Eyeliner -->
  <ellipse cx='265' cy='345' rx='18' ry='12' fill='#0c0a09'/>
  <ellipse cx='335' cy='345' rx='18' ry='12' fill='#0c0a09'/>
  <circle cx='265' cy='345' r='8' fill='#451a03'/>
  <circle cx='335' cy='345' r='8' fill='#451a03'/>
  <circle cx='267' cy='343' r='2.5' fill='#ffffff'/>
  <circle cx='337' cy='343' r='2.5' fill='#ffffff'/>
  <!-- Eyebrows -->
  <path d='M245 325 Q265 318 285 330' stroke='#1c1917' stroke-width='6' fill='none' stroke-linecap='round'/>
  <path d='M315 330 Q335 318 355 325' stroke='#1c1917' stroke-width='6' fill='none' stroke-linecap='round'/>
  <!-- Nose & Mouth -->
  <path d='M295 345 L292 385 L308 385 Z' fill='#8c532b'/>
  <path d='M280 415 Q300 425 320 415' stroke='#78350f' stroke-width='3' fill='none'/>

  <!-- Red Bandana -->
  <path d='M200 295 Q300 270 400 295 L405 325 Q300 300 195 325 Z' fill='url(#bandanaJack)'/>
  <path d='M195 305 Q170 340 180 420 L200 410 Q190 350 205 315 Z' fill='url(#bandanaJack)'/>

  <!-- Pirate Tricorn Hat -->
  <path d='M90 270 Q300 180 510 270 Q460 210 300 140 Q140 210 90 270 Z' fill='#292524'/>
  <path d='M160 230 Q300 110 440 230 Q370 160 300 150 Q230 160 160 230 Z' fill='#1c1917'/>

  <!-- Lighting & Name Badge -->
  <rect x='30' y='30' width='180' height='32' rx='16' fill='rgba(0,0,0,0.7)' stroke='#eab308' stroke-width='1.5'/>
  <text x='120' y='51' fill='#fef08a' font-family='system-ui, sans-serif' font-size='12' font-weight='800' text-anchor='middle'>JACK SPARROW</text>
</svg>