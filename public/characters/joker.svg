<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 750' width='600' height='750'>
  <defs>
    <radialGradient id='bgJoker' cx='50%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#142718'/>
      <stop offset='60%' stop-color='#0b170e'/>
      <stop offset='100%' stop-color='#020704'/>
    </radialGradient>
    <linearGradient id='suitJoker' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#581c87'/>
      <stop offset='100%' stop-color='#3b0764'/>
    </linearGradient>
    <linearGradient id='vestJoker' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#eab308'/>
      <stop offset='100%' stop-color='#ca8a04'/>
    </linearGradient>
    <linearGradient id='hairJoker' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#15803d'/>
    </linearGradient>
  </defs>
  <rect width='600' height='750' fill='url(#bgJoker)'/>

  <!-- Purple Suit & Torso -->
  <path d='M90 750 L150 490 L230 520 L300 660 L370 520 L450 490 L510 750 Z' fill='url(#suitJoker)'/>
  <polygon points='230,510 370,510 330,660 270,660' fill='url(#vestJoker)'/>
  <polygon points='260,500 340,500 300,580' fill='#0284c7'/>
  <polygon points='290,520 310,520 315,620 300,640 285,620' fill='#16a34a'/>

  <!-- Green Slicked Hair (Background & Top) -->
  <path d='M170 330 Q150 180 300 160 Q450 180 430 330 Q390 200 300 200 Q210 200 170 330 Z' fill='url(#hairJoker)'/>
  <path d='M180 250 Q230 180 300 170 Q370 180 420 250 Q360 210 300 210 Q240 210 180 250 Z' fill='#4ade80'/>

  <!-- White Painted Face & Neck -->
  <path d='M260 430 L340 430 L330 510 L270 510 Z' fill='#e2e8f0'/>
  <ellipse cx='300' cy='350' rx='95' ry='115' fill='#f1f5f9'/>

  <!-- Dark Eyes with Smudged Black Greasepaint -->
  <ellipse cx='260' cy='335' rx='25' ry='22' fill='#1e293b'/>
  <ellipse cx='340' cy='335' rx='25' ry='22' fill='#1e293b'/>
  <circle cx='260' cy='335' r='8' fill='#0f172a'/>
  <circle cx='340' cy='335' r='8' fill='#0f172a'/>
  <circle cx='262' cy='333' r='2.5' fill='#ffffff'/>
  <circle cx='342' cy='333' r='2.5' fill='#ffffff'/>

  <!-- Nose -->
  <path d='M295 335 L290 375 L310 375 Z' fill='#cbd5e1'/>

  <!-- Iconic Red Joker Smile / Scar -->
  <path d='M220 380 Q300 450 380 380 Q350 430 300 430 Q250 430 220 380 Z' fill='#dc2626'/>
  <path d='M240 395 Q300 420 360 395' stroke='#991b1b' stroke-width='4' fill='none'/>

  <!-- Top Badge -->
  <rect x='30' y='30' width='140' height='32' rx='16' fill='rgba(0,0,0,0.7)' stroke='#22c55e' stroke-width='1.5'/>
  <text x='100' y='51' fill='#86efac' font-family='system-ui, sans-serif' font-size='12' font-weight='800' text-anchor='middle'>EL JOKER</text>
</svg>